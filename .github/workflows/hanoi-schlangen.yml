name: Hanoi-Schlangen holen
on:
  push:
    paths: ['.github/workflows/hanoi-schlangen.yml','werkzeug/hanoi_schlangen.py']
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p hanoi/daten && python3 werkzeug/hanoi_schlangen.py
      - run: |
          git config user.name "hanoi-daten"
          git config user.email "hanoi-daten@users.noreply.github.com"
          git add hanoi/daten/schlangen.json hanoi/daten/schlangen-sichtungen.json
          git diff --cached --quiet || { git commit -m "Hanoi-Schlangen aktualisiert"; git pull --rebase origin main; git push; }
