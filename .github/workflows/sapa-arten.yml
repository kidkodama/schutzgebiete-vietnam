name: Sa-Pa-Vögel und Schlangen holen
on:
  push:
    paths: ['.github/workflows/sapa-arten.yml','werkzeug/sapa_voegel.py','werkzeug/sapa_schlangen.py']
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p sapa/daten && python3 werkzeug/sapa_voegel.py && python3 werkzeug/sapa_schlangen.py
      - run: |
          git config user.name "sapa-daten"
          git config user.email "sapa-daten@users.noreply.github.com"
          git add sapa/daten
          git diff --cached --quiet || { git commit -m "Sa-Pa-Arten aktualisiert"; git pull --rebase origin main; git push; }
