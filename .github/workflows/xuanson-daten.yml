name: Xuân-Sơn-Daten holen
on:
  push:
    paths: ['.github/workflows/xuanson-daten.yml','werkzeug/xuanson_daten.py']
  schedule:
    - cron: '29 3 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p xuanson/daten && python3 werkzeug/xuanson_daten.py
      - run: |
          git config user.name "xuanson-daten"
          git config user.email "xuanson-daten@users.noreply.github.com"
          git add xuanson/daten
          git diff --cached --quiet || { git commit -m "Xuân-Sơn-Daten aktualisiert"; git pull --rebase origin main; git push; }
