name: Hanoi-Vogelarten holen
on:
  push:
    paths: ['.github/workflows/hanoi-voegel.yml','werkzeug/hanoi_voegel.py']
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p hanoi/daten && python3 werkzeug/hanoi_voegel.py
      - run: |
          git config user.name "hanoi-daten"
          git config user.email "hanoi-daten@users.noreply.github.com"
          git add hanoi/daten/voegel.json
          git diff --cached --quiet || { git commit -m "Hanoi-Vogelarten aktualisiert"; git pull --rebase origin main; git push; }
