name: Hanoi-Karte live testen
on:
  push:
    paths: ['.github/workflows/hanoi-test.yml','werkzeug/test_live.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p werkstatt test-bilder
          cd werkstatt && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps webkit chromium >/dev/null
          cd .. && NODE_PATH=werkstatt/node_modules node werkzeug/test_live.js 2>&1 | tee test-bilder/bericht.txt
      - run: |
          git config user.name "hanoi-test"
          git config user.email "hanoi-test@users.noreply.github.com"
          git checkout --orphan test-bilder-neu
          git rm -rfq --cached .
          git add -f test-bilder
          git commit -qm "Testlauf"
          git push -f origin HEAD:test-bilder
